<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title if title else "InformatikFit" }}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">
  <div class="container topbar-row">
    <a class="brand" href="{{ url_for('home') }}">InformatikFit</a>

    <nav class="nav">
      {% if current_user.is_authenticated %}

        <a class="nav-link" href="{{ url_for('home') }}">Start</a>

        <!-- Lernbereiche Dropdown -->
        <div class="nav-dropdown">
          <button class="nav-link nav-dropdown-btn" type="button">
            Lernbereiche ▾
          </button>

          <div class="nav-dropdown-menu">
            <a class="nav-link" href="{{ url_for('digitaler_informationsaustausch') }}">
              Digitaler Informationsaustausch
            </a>
            <a class="nav-link" href="{{ url_for('datenverarbeitung') }}">
              Datenverarbeitung
            </a>
            <a class="nav-link" href="{{ url_for('programmieren') }}">
              Programmieren
            </a>
          </div>
        </div>

        <a class="nav-link" href="{{ url_for('leaderboard') }}">Rangliste</a>
        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>

        <!-- User ganz rechts -->
        <span class="nav-link user-pill">
          👤 {{ current_user.username }} ({{ current_user.total_points }} P.)
        </span>

      {% else %}
        <a class="nav-link" href="{{ url_for('login') }}">Login</a>
        <a class="nav-link" href="{{ url_for('register') }}">Registrieren</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

</body>
</html>
