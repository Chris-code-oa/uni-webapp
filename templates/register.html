{% extends "base.html" %}
{% block title %}Registrieren – Informatik LMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h2 class="mb-3 text-center">Registrieren</h2>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Benutzername</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Passwort</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100">Account erstellen</button>
      </form>
      <p class="mt-3 text-center">
        Schon einen Account? <a href="{{ url_for('login') }}">Zum Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
